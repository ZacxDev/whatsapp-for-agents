# 🔴 PLACEHOLDER SECRETS — EVERY VALUE BELOW IS LITERALLY `CHANGE-ME` FOLLOWED BY
# NOTHING. Nothing here is a real credential, a real token or a real key, and
# applying this file UNCHANGED creates a deployment that can connect to nothing.
# That is deliberate: it keeps this repo free of any operator's secret material
# while still naming the exact Secrets and keys the pods expect.
#
# BEFORE DEPLOYING, replace every value. Either edit this file, or
# delete `secrets.yaml` from kustomization.yaml and create the Secrets out of
# band (`kubectl -n whatsapp create secret ...`). README.md lists which key is
# read by which pod.
#
# 🔴 WHY THE SECRETS LIVE HERE AND NOT SOMEWHERE ELSE: a `secretKeyRef` is ALWAYS
# resolved in the REFERENCING POD'S NAMESPACE — it cannot name another namespace's
# Secret. So the correctly-scoped copy must exist beside the pods that read it.
# That is why these are same-namespace Secrets rather than references to a
# shared credential store. If you adopt a secret-replication operator, this file
# is the thing it would replicate.
#
# Generate real material with e.g. `openssl rand -base64 32` (tokens and keys),
# `openssl rand -hex 16` (passwords), and `age-keygen` (the backup recipient).
---
# The wuzapi daemon's own identity + crypto material, plus the webhook signing key.
apiVersion: v1
kind: Secret
metadata:
  name: whatsapp-auth
  namespace: whatsapp
type: Opaque
stringData:
  # Admin/session API token. Guards the daemon's ADMIN endpoints — creating a
  # wuzapi user, for instance. Note the session-status/QR call is authenticated
  # with the USER's token instead; docs/pairing.md has the exact commands.
  WUZAPI_ADMIN_TOKEN: CHANGE-ME
  # Absent, wuzapi generates this at first start and LOSES it on restart, which
  # takes the linked device session with it. Set it before the first pairing.
  WUZAPI_GLOBAL_ENCRYPTION_KEY: CHANGE-ME
  # The webhook signing key. 🔴 ONE KEY, TWO REFERENCES: the daemon takes it as
  # WUZAPI_GLOBAL_HMAC_KEY and the consumer takes the same Secret key as
  # WHATSAPP_HMAC_KEY, so the value the two ends of the webhook use is set in one
  # place. Must be at least 32 bytes — the consumer refuses to serve with a shorter
  # key, which is why the CHANGE-ME placeholder cannot be deployed by accident.
  #
  # ⚠ Necessary but NOT sufficient: wuzapi also has a PER-USER signing key, set
  # separately with `POST /session/hmac/config`, and the consumer only ever sees one
  # value. Every key in the signing path must equal this one. When they diverge the
  # symptom is `unauthenticated` climbing while nothing is stored — which reads as
  # "the integration does nothing". See README.md §5 and docs/pairing.md.
  WUZAPI_GLOBAL_HMAC_KEY: CHANGE-ME
---
# The BROADER Postgres credential: used by the wuzapi daemon (which owns the
# session database), by the db-init Job (which creates that database) and by the
# backup CronJob (which dumps both databases).
#
# 🔴 THIS IS NOT THE CREDENTIAL THE CONSUMER OR SENDER USE. It can connect to the
# `wuzapi` database, where the linked-device send tokens live — so a pod holding
# it can read them. See the role split in README.md before granting it to
# anything new.
apiVersion: v1
kind: Secret
metadata:
  name: whatsapp-pg-admin
  namespace: whatsapp
type: Opaque
stringData:
  password: CHANGE-ME
---
# The APP ROLE's DSN — the credential for the two pods that only touch the
# ARCHIVE (`whatsapp` schema) and must not be able to reach the session database.
#
# `whatsapp_app` owns schema `whatsapp` (so the consumer's `ensure_schema` can
# apply its own DDL) and has NO connect privilege on the `wuzapi` database. That
# split is a security property, not a convenience: it is what stops a compromised
# webhook parser from reading the send tokens.
apiVersion: v1
kind: Secret
metadata:
  name: whatsapp-app-db
  namespace: whatsapp
type: Opaque
stringData:
  # Shape: postgresql://<user>:<password>@<host>:<port>/<archive-database>
  # 🔴 The host must be the SAME server the daemon's DB_HOST names, and the role
  # must be the app role — see README.md. The code additionally accepts
  # WHATSAPP_PG_HOST / WHATSAPP_PG_PORT to rewrite the address, which is how a
  # local run points the same DSN at a forwarded port; the Deployment does not
  # set them.
  pg-dsn: postgresql://whatsapp_app:CHANGE-ME@CHANGE-ME-postgres-host:5432/whatsapp
---
# Object-store credential the consumer uses to archive media.
apiVersion: v1
kind: Secret
metadata:
  name: whatsapp-consumer-minio
  namespace: whatsapp
type: Opaque
stringData:
  minio-access-key: CHANGE-ME
  minio-secret-key: CHANGE-ME
---
# The send credential, and the human-approval token.
apiVersion: v1
kind: Secret
metadata:
  name: whatsapp-sender-auth
  namespace: whatsapp
type: Opaque
stringData:
  # The send token belonging to the ONE paired wuzapi user. Exactly one pod reads
  # this: whatsapp-sender. The consumer has no user token at all.
  WUZAPI_USER_TOKEN: CHANGE-ME
  # 🔴 DELIBERATELY NOT MOUNTED INTO ANY POD — deployment-sender.yaml does not
  # reference this key. `approve` requires it, and it is supplied by the operator
  # on the `kubectl exec` that approves, so the moment the sender pod holds it the
  # approval step stops being human and becomes decorative. It lives here only so
  # there is one documented place to keep it.
  WHATSAPP_APPROVAL_TOKEN: CHANGE-ME
---
# The nightly backup's object-store credential and the client-side encryption
# recipient.
apiVersion: v1
kind: Secret
metadata:
  name: whatsapp-backup-s3
  namespace: whatsapp
type: Opaque
stringData:
  S3_ACCESS_KEY: CHANGE-ME
  S3_SECRET_KEY: CHANGE-ME
  # 🔴 An age public recipient (`age1...`) YOU control. The backup job encrypts
  # the dumps to this recipient inside the pod, before they leave it — the
  # session dump is account-takeover material, so it is never stored in
  # plaintext. Generate with `age-keygen`; keep the PRIVATE key off the cluster
  # and off the object store, or the encryption protects nothing.
  AGE_RECIPIENT: CHANGE-ME
