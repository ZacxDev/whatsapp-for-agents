name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The bootstrap script's inputs — see deploy/postgres/init/01-databases.sh.
      # These are throwaway CI credentials on an ephemeral runner, not secrets.
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      POSTGRES_USER: postgres
      WHATSAPP_APP_PASSWORD: ci-app-password
      WUZAPI_DB_PASSWORD: ci-wuzapi-password
      WHATSAPP_TEST_DSN: postgresql://whatsapp_app:ci-app-password@127.0.0.1:5432/whatsapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # 🔴 THE SAME SCRIPT THE COMPOSE STACK RUNS, so CI exercises the role split
      # rather than a CI-shaped shortcut. Two databases, one role each, PUBLIC's
      # CONNECT revoked — that is the property that keeps the archive role out of
      # the linked-device session, and it should not be able to rot unnoticed.
      - name: Bootstrap databases and the role split
        run: bash deploy/postgres/init/01-databases.sh

      - name: Prove the role split still holds
        run: |
          # Positive control: the archive role reaches its own database.
          psql "postgresql://whatsapp_app:${WHATSAPP_APP_PASSWORD}@127.0.0.1:5432/whatsapp" \
            -Atc 'select current_database()'
          # Negative control: and is REFUSED on the session store. If this
          # succeeds, the split is gone — fail loudly rather than print a warning.
          if psql "postgresql://whatsapp_app:${WHATSAPP_APP_PASSWORD}@127.0.0.1:5432/wuzapi" \
              -Atc 'select 1' >/dev/null 2>&1; then
            echo "::error::the archive role can reach wuzapi — the role split is broken"
            exit 1
          fi
          echo "role split holds"

      # 🔴 ZERO SKIPS IS ENFORCED, not asserted in a README. The two DSN-gated
      # suites carry the SQL-wiring coverage a hermetic test structurally cannot
      # reach, and an import guard in these modules once turned a FAILURE into a
      # SKIP — which left the suite green. A step that counts them is what stops
      # that happening again.
      - name: Run the suite (hermetic + live Postgres)
        run: |
          set -o pipefail
          python -m pytest tests -q -rs | tee /tmp/pytest.txt
          if grep -qE '^SKIPPED' /tmp/pytest.txt; then
            echo "::error::a test module skipped — expected 0 skips with WHATSAPP_TEST_DSN set"
            exit 1
          fi

  # The FLAKE is a second build path, so it is a second chance to lose the
  # property the repo exists for — the consumer image must carry no send code.
  # `tests/test_image_split.py` guards that for the Dockerfiles, and the flake
  # asserts the same disjointness at EVAL time; this job checks the thing neither
  # of those can: what actually lands in the built image at /app.
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: The flake evaluates (its split guard included)
        run: nix flake show

      # `checks.tests` is the hermetic suite, run the way a consumer of the flake
      # would run it. ⚠ It does NOT claim the 0-skip result above: a Nix check has
      # no Postgres, so the two DSN-gated modules skip. What it does enforce is
      # that nothing ELSE skips.
      - name: The Nix check
        run: nix build -L .#checks.x86_64-linux.tests

      - name: Build both images
        run: |
          nix build .#packages.x86_64-linux.consumer-image --out-link /tmp/consumer.tar.gz
          nix build .#packages.x86_64-linux.sender-image --out-link /tmp/sender.tar.gz
          docker load -i /tmp/consumer.tar.gz
          docker load -i /tmp/sender.tar.gz

      # 🔴 The assertion neither `test_image_split.py` nor the flake's eval-time
      # guard makes: read the BUILT image's file list. Both of those check a
      # DECLARATION (a Dockerfile's COPY lines, a set in the flake); this checks
      # what a parser bug could actually import at runtime.
      - name: The built images keep the module split
        run: |
          set -euo pipefail
          CIPY=$(docker inspect whatsapp-for-agents-consumer:0.1.0 --format '{{index .Config.Cmd 0}}')
          SIPY=$(docker inspect whatsapp-for-agents-sender:0.1.0 --format '{{index .Config.Cmd 0}}')
          C=$(docker run --rm --entrypoint "$CIPY" whatsapp-for-agents-consumer:0.1.0 \
                -c "import os; print(' '.join(sorted(os.listdir('/app'))))")
          S=$(docker run --rm --entrypoint "$SIPY" whatsapp-for-agents-sender:0.1.0 \
                -c "import os; print(' '.join(sorted(os.listdir('/app'))))")
          echo "consumer /app: $C"
          echo "sender   /app: $S"
          case " $C " in
            *" sender.py "*|*" _wa_outbound.py "*)
              echo "::error::the consumer image ships SEND code — a parser bug could reach a send endpoint"; exit 1 ;;
          esac
          case " $S " in
            *" consumer.py "*|*" _wa_parse.py "*|*" _wa_webhook.py "*|*" _minio.py "*)
              echo "::error::the sender image ships INGEST code — it is meant to be a tiny auditable surface"; exit 1 ;;
          esac
          case " $C " in *" _wa_db.py "*) ;; *) echo "::error::the consumer image lost _wa_db.py"; exit 1 ;; esac
          case " $S " in *" _wa_db.py "*) ;; *) echo "::error::the sender image lost _wa_db.py"; exit 1 ;; esac
          echo "split holds in both built images"
